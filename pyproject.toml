[project]
name = "agenticrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.121.0",
    "fastembed>=0.8.0",
    "langchain>=1.3.16",
    "langchain-text-splitters>=1.1.2",
    "openai>=3.3.1",
    "pymupdf4llm>=1.28.2",
    "qdrant-client>=1.19.0",
    "tiktoken>=0.14.0",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers>=4.57.6",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }
