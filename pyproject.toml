[project]
name = "agenticrag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "docling>=2.121.0",
    "duckdb>=1.5.5",
    "langchain>=1.3.16",
    "langchain-openrouter>=0.2.8",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "pydantic-settings>=2.15.0",
    "pymupdf4llm>=1.28.2",
    "python-dotenv>=1.2.3",
    "sqlalchemy>=2.0.52",
    "torch==2.13.0",
    "torchvision==0.28.0",
    "transformers>=4.57.6",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
